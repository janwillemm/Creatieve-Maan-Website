home:
  - question: Wat doet De Creatieve M(a)an?
    answer: >-
      De Creatieve M(a)an is het werk van Jan-Willem Manenschijn: hij ontwerpt
      ervaringen die complexiteit inzichtelijk maken en mensen activeren. Dat
      kan een maatwerk serious game of e-learning zijn, een digitale tool of
      een boekbare training, workshop of presentatie.
  - question: Welke diensten kan ik afnemen?
    answer: >-
      Drie diensten. [Serious games](/serious-games/): fysieke en digitale
      maatwerkervaringen. [Tools](/tools/): interactieve hulpmiddelen, vaak
      met AI. [Trainingen](/aan-de-slag/): standaard workshops en trainingen
      die je direct kunt boeken.
  - question: Wat is een serious game?
    answer: >-
      Een serious game is een spel dat is ontworpen voor een serieus doel —
      leren, bewustwording of gedragsverandering — niet alleen voor vermaak.
      Deelname voelt als spelen; de opbrengst is inzicht, gesprek of nieuwe
      vaardigheden. [Uitleg van een ontwerper](/wat-is-een-serious-game/).
  - question: Hoe neem ik contact op?
    answer: >-
      Mail naar [jan-willem@creatievemaan.nl](mailto:jan-willem@creatievemaan.nl)
      of bel [06 28 08 77 58](tel:+31628087758). In een kort gesprek kijken we
      welke dienst past.

over_mij:
  - question: Wie is Jan-Willem Manenschijn?
    answer: >-
      Jan-Willem Manenschijn is serious game designer, conceptontwikkelaar en
      trainer uit Houten (Utrecht). Hij ontwerpt ervaringen die complexiteit
      inzichtelijk maken en mensen activeren. Hij studeerde Technische
      Informatica aan de TU Delft, was medeoprichter en creatief directeur van
      Raccoon Serious Games en werkt nu via De Creatieve M(a)an, Preludens,
      Jump Serious Games en InteractGGZ.
  - question: Welke opleiding en ervaring heeft hij?
    answer: >-
      Hij studeerde Technische Informatica aan de TU Delft (2011–2016) en deed
      minors in Research Based Business (Universiteit Leiden) en Strategy
      Consulting (RSM Erasmus). Sinds 2015 ontwerpt hij escape rooms en serious
      games; van 2018 tot 2025 leidde hij Raccoon als creatief directeur.
  - question: Waarin verschilt zijn aanpak?
    answer: >-
      Hij combineert een technische achtergrond met groepsdynamiek: eerst de
      vraag achter de vraag, dan een speelbare ervaring of tool, daarna
      reflectie of doorontwikkeling. Eén aanspreekpunt, een vast proces, en
      een netwerk van makers. De groep of de gebruiker staat centraal, niet
      het script.

aan_de_slag:
  - question: Welke trainingen kan ik bij Jan-Willem boeken?
    answer: >-
      Vier standaardproducten: de workshop laaggeletterdheid, de workshop Een
      eigen thuis, de training Spelend impact maken en de training Effectief
      en pragmatisch werken met AI. Presentaties op maat zijn ook mogelijk.
  - question: Wat kost een workshop of training?
    answer: >-
      De prijs hangt af van groepsgrootte, locatie en duur. In het eerste
      gesprek krijg je een duidelijk bedrag. Er is geen open
      uurtje-factuurtje-traject voor deze standaardproducten.
  - question: Hoe lang duurt een sessie?
    answer: >-
      Dat hangt af van de vorm. De workshop laaggeletterdheid werkt met rondes
      van circa 15 minuten plus nagesprek, en is schaalbaar tot ongeveer 50
      deelnemers. Voor de andere trainingen stemmen we duur en groepsgrootte
      af bij het boeken.
  - question: Werk je landelijk?
    answer: >-
      Ja. Jan-Willem werkt vanuit Houten (Utrecht) en begeleidt sessies op
      locatie of online, verspreid over Nederland.

serious_games:
  - question: Wat is het verschil tussen een serious game en een training?
    answer: >-
      Een [serious game](/serious-games/) is een maatwerkervaring of
      e-learning die we ontwerpen. Een [training](/aan-de-slag/) is een
      standaardproduct dat je direct boekt. Soms is de workshop de vorm;
      soms moet er eerst een spel worden gemaakt.
  - question: Wat kost een maatwerk serious game?
    answer: >-
      Short Stories via Preludens kosten indicatief circa € 1.500. Een
      MicroGame Story circa € 10.000. Fysiek of digitaal maatwerk krijgt een
      vaste prijs na de intake, als de scope helder is.
  - question: Hoe lang duurt een ontwerptraject?
    answer: >-
      Dat volgt het vaste proces: kennismaking, vraag scherp, concept,
      testen, productie, overdracht. Een Short Story is sneller dan een
      volledig bordspel. In het eerste gesprek krijg je een realistische
      doorlooptijd.
  - question: Werk je alleen of met een team?
    answer: >-
      Jij hebt één aanspreekpunt: Jan-Willem. Productie gebeurt met een
      netwerk van creatieve zzp’ers en partnerorganisaties, zodat vormgeving,
      inhoud en techniek kloppen.

tools:
  - question: Wat voor tools maak je?
    answer: >-
      Digitale hulpmiddelen die inzicht geven of werk efficiënter maken.
      Voorbeelden: een [EMDR-toolkit](/projecten/emdr-toolkit/) met
      kindgerichte werkgeheugenactiviteiten, en [deze website](/projecten/creatieve-maan-website/).
  - question: Hoe snel staat er iets?
    answer: >-
      Vaak een prototype in dagen, geen maanden. AI versnelt het bouwen;
      testers uit de praktijk bepalen of het blijft.
  - question: Is dit hetzelfde als een e-learning?
    answer: >-
      Nee. Een e-learning (Preludens, MicroGame Stories) hoort bij
      [serious games](/serious-games/). Een tool is een herhaalbaar
      hulpmiddel in een proces — een balk, een app, een site, een beslisboom.
  - question: Voor wie bouw je tools?
    answer: >-
      Voor professionals en teams met een concreet knelpunt, onder meer in
      de GGZ, het onderwijs en kenniswerk. Samenwerking loopt onder andere
      via InteractGGZ.

preludens:
  - question: Wat is Preludens?
    answer: >-
      Preludens is het e-learningproduct van Jan-Willem Manenschijn binnen
      [serious games](/serious-games/). Organisaties bereiden een brede
      doelgroep voor op verandering met stripverhalen, MicroGames en
      directe feedback in de eigen leeromgeving.
  - question: Wat is het verschil tussen MicroGame Stories en Short Stories?
    answer: >-
      MicroGame Stories zijn volledige storylines (circa 7 hoofdstukken en
      5 MicroGames, indicatief circa € 10.000). Short Stories zijn compacte
      dilemma’s van 2 tot 5 keuzes (indicatief circa € 1.500), bedoeld voor
      een snelle, praktijkgerichte interventie.
  - question: Voor wie is Preludens bedoeld?
    answer: >-
      Voor organisaties met een veranderings- of opleidingsvraagstuk die een
      brede groep medewerkers of professionals willen meenemen — niet met
      passieve slides, maar met verhaal, keuze en herhaling.
  - question: Kan Preludens in onze eigen leeromgeving?
    answer: >-
      Ja. Feedback en voortgang zijn bedoeld om te landen in de bestaande
      leeromgeving en processen van de opdrachtgever, zodat de ervaring
      schaalbaar inzetbaar is.

serious_game:
  - question: Wat is een serious game?
    answer: >-
      Een serious game is een spel dat is ontworpen voor een serieus doel:
      leren, bewustwording, samenwerking of gedragsverandering. Het gebruikt
      spelmechanismen — keuzes, doelen, feedback — zodat deelnemers iets
      ervaren wat een presentatie zelden overbrengt.
  - question: Wat is het verschil tussen een serious game en gamification?
    answer: >-
      Gamification voegt spelelementen toe aan een bestaande taak, zoals punten
      of badges bij een e-learning. Een serious game is zelf de ervaring: een
      compleet spel waarin het leerdoel in de keuzes en het verloop zit.
  - question: Wanneer kies je voor een serious game?
    answer: >-
      Als mensen iets moeten voelen of oefenen, niet alleen weten. Bijvoorbeeld
      bij lastige thema’s (laaggeletterdheid, dakloosheid), bij verandering in
      werk, of wanneer een team nieuwe vaardigheden moet toepassen.
  - question: Wie ontwerpt serious games in Nederland?
    answer: >-
      Serious games worden ontworpen door gespecialiseerde bureaus en
      zelfstandige ontwerpers. Jan-Willem Manenschijn (De Creatieve M(a)an)
      ontwerpt en begeleidt ze sinds 2015, onder meer via Raccoon Serious Games,
      Jump Serious Games en Preludens.
