permalink: pretty
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTENT-VULLEN.md
  - vendor
  - .bundle
  - .github

collections:
  projects:
    output: true
    
    permalink: /projecten/:name/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
      image: https://creatievemaan.nl/wp-content/uploads/2024/12/Creative-concept-developer-Jan-willem-Manenschijn-de-creatieve-maan-outline-768x768.png
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      image: https://creatievemaan.nl/wp-content/uploads/2024/12/Creative-concept-developer-Jan-willem-Manenschijn-de-creatieve-maan-outline-768x768.png

