title: De Creatieve M(a)an
tagline: Serious games, conceptontwikkeling en training
description: >-
  Jan-Willem Manenschijn ontwerpt serious games en leerervaringen die mensen
  in beweging brengen. Freelance conceptontwikkelaar en trainer vanuit Houten
  (Utrecht): workshops, maatwerkspellen en Preludens.
url: "https://creatievemaan.nl"
baseurl: ""
lang: nl
locale: nl_NL
logo: /assets/images/favicon.svg
email: jan-willem@creatievemaan.nl
phone: "06 28 08 77 58"
phone_link: "+31628087758"
kvk: "73566888"
vat: "NL859581160B01"

