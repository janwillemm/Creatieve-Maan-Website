title: De Creatieve M(a)an
tagline: Ik ontwerp ervaringen die complexiteit inzichtelijk maken en mensen activeren.
description: >-
  Jan-Willem Manenschijn ontwerpt ervaringen die complexiteit inzichtelijk
  maken en mensen activeren. Serious games, digitale tools en trainingen
  vanuit Houten (Utrecht).
url: "https://creatievemaan.nl"
baseurl: ""
lang: nl
locale: nl_NL
logo: /assets/images/favicon.svg
email: jan-willem@creatievemaan.nl
phone: "06 28 08 77 58"
phone_link: "+31628087758"
kvk: "73566888"
vat: "NL859581160B01"

